name: Daily KRX Brief Automation

on:
  repository_dispatch:
    types: [gas_trigger]
  #schedule:
    # 💡 한국 시간(KST) 평일 오후 4시 38분 설정
    # 16:38 KST - 9시간 = 07:38 UTC
    # - cron: '38 7 * * 1-5'
  
  workflow_dispatch:      # 수동 'Run workflow' 버튼 실행 지원
  push:
    branches: [ "main" ]  # main 브랜치 푸시 시 자동 실행

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        # PDF 변환에 필요한 poppler-utils 및 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-nanum

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdf2image google-generativeai pypdf finance-datareader

      # 1. 기존 KRX PDF 리포트 다운로드 및 텔레그램 발송 (원본 유지)
      - name: Run KRX Automation
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: python krx_brief.py

      # [추가 1] KIS 토큰 파일 캐싱 (연속 테스트 시 재발급 차단 방지)
      - name: Cache KIS Token
        uses: actions/cache@v4
        with:
          path: kis_token.json
          key: kis-token-cache-${{ github.ref_name }}
          restore-keys: |
            kis-token-cache-

      # 2. 실측 마감 데이터 + AI 테마 요약 발송
      # [추가 2] KIS_APP_KEY, KIS_APP_SECRET 주입
      - name: Run Market Data Summary
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python fetch_market_summary.py

      # 3. 변경 파일(PDF, JPG 등) 커밋 및 푸시
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'action@github.com'
          
          git add -A
          # [추가 3] 보안 토큰 파일 커밋 방지
          git reset kis_token.json 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: cleanup old reports and update latest"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi
